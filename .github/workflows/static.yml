name: Deploy static content to Pages

on:
  push:
    branches: ["master", "nova-tentativa"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: |
          python3 -m http.server 8080 --directory src > /tmp/http-server.log 2>&1 &
          echo $! > /tmp/http-server.pid
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/index.html > /dev/null; then
              echo "Servidor iniciado com sucesso."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/http-server.log
          exit 1

      - name: Generate BackstopJS reference
        run: npx backstop reference --config=backstopConfig.js

      - name: Test BackstopJS
        run: npx backstop test --config=backstopConfig.js

      - name: Copy report to published directory
        if: always()
        run: |
          mkdir -p src/report
          if [ -d backstop_data/html_report ]; then
            cp -R backstop_data/html_report src/report/html_report
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
