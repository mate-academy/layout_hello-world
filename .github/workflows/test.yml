name: Test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: |
          python3 -m http.server 8080 --directory src > /tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/http-server.pid

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/index.html > /dev/null; then
              echo "Servidor iniciado com sucesso."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/http-server.log
          exit 1

      - name: Run lint
        run: npm run lint

      - name: Run BackstopJS test
        run: npx backstop test --config=backstopConfig.js

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: backstop_data
          if-no-files-found: ignore
